[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.27.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch==2.9.1",
    "wandb>=0.19.0",
]

[tool.uv]
# hf-xet's transfer backend hangs/403s on GCP (huggingface/xet-core#800) — huggingface-hub pulls it
# in unconditionally, HF_HUB_DISABLE_XET alone doesn't stop it from being installed, only used.
# This marker is never true, so uv resolves it to "not needed" instead of installing it at all.
override-dependencies = ["hf-xet ; sys_platform == 'never'"]
